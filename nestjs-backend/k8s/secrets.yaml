apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database URLs (base64 encoded in production)
  DATABASE_URL: "postgresql://urlshortener_user:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/url_shortener_prod"
  MONGODB_URI: "mongodb://root:CHANGE_ME_IN_PRODUCTION@mongodb-service:27017/url_shortener_prod?authSource=admin"
  REDIS_URL: "redis://:CHANGE_ME_IN_PRODUCTION@redis-service:6379"
  
  # JWT Secrets
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_MINIMUM_32_CHARACTERS_LONG"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION_REFRESH_SECRET_MINIMUM_32_CHARACTERS"
  
  # Database Passwords
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MONGO_ROOT_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Session Secret
  SESSION_SECRET: "CHANGE_ME_IN_PRODUCTION_SESSION_SECRET"
  
  # AWS Credentials (if using AWS services)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  CLOUDWATCH_LOG_GROUP: "/aws/k8s/url-shortener"
  CLOUDWATCH_LOG_STREAM: "nestjs-app"
  
  # Email Configuration (if using email features)
  SMTP_HOST: "smtp.yourmailprovider.com"
  SMTP_PORT: "587"
  SMTP_USER: "your_email@yourdomain.com"
  SMTP_PASS: "your_email_password"
  EMAIL_FROM: "noreply@yourdomain.com"
  
  # External API Keys
  GEOIP_API_KEY: ""
  
  # Monitoring
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_USER: "urlshortener_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"