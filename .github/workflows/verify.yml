name: Verify

# Runs on every pull request, and on main so the default branch always has a
# known-good signal. Nothing here writes to the repository.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Must match docker-compose.yml — the schema uses uuidv7(), which is
        # native in Postgres 18 and does not exist in 17.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: snapurl
          POSTGRES_PASSWORD: snapurl
          POSTGRES_DB: snapurl
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U snapurl -d snapurl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl
      DATABASE_SSL: "false"
      NODE_ENV: test
      # Throwaway values. Real deployments read these from SSM Parameter Store;
      # these exist only so the apps will boot in CI.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real-000
      WEB_ORIGIN: http://localhost:3000
      DEFAULT_DOMAIN: localhost:3002
      REDIRECT_ORIGIN: http://localhost:3002
      MAIL_TRANSPORT: outbox
      # The smoke suites make several hundred requests in a couple of minutes.
      # The production default of 120/min would throttle them and fail the run
      # for a reason that has nothing to do with the change under test.
      THROTTLE_LIMIT: "100000"
      LOG_LEVEL: warn
      # CI builds the frontend to prove it compiles, not to serve it. Without
      # this, next.config.ts correctly refuses to build without a real API URL.
      SNAPURL_ALLOW_UNCONFIGURED_BUILD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml disagrees with any
      # package.json, which catches a dependency added without committing the
      # lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      # Proves the migrations apply to an empty database, not just to whatever
      # state a developer's machine happens to be in.
      - name: Migrate
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Start the API and redirect service
        run: |
          # PORT is set per-process, not on the step: a step-level PORT would
          # apply to both and the second service would fail to bind.
          PORT=3001 node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          PORT=3002 node apps/redirect/dist/main.js > /tmp/redirect.log 2>&1 &
          echo "REDIRECT_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for both to be healthy
        run: |
          # Poll rather than sleep: a fixed delay is either too short on a slow
          # runner or wasted time on a fast one.
          for name in "api:3001/api/v1/health" "redirect:3002/health"; do
            label="${name%%:*}"; url="http://localhost:${name#*:}"
            for i in $(seq 1 40); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$label is up"; break
              fi
              if [ "$i" = "40" ]; then
                echo "::error::$label did not become healthy within 40s"
                echo "--- api.log ---";      tail -50 /tmp/api.log      || true
                echo "--- redirect.log ---"; tail -50 /tmp/redirect.log || true
                exit 1
              fi
              sleep 1
            done
          done

      - name: Smoke — dashboard API
        run: bash scripts/smoke.sh

      - name: Smoke — redirect path
        run: bash scripts/smoke-redirect.sh

      # Without this a failed smoke run shows only which assertion failed, not
      # the server-side reason for it.
      - name: Service logs
        if: failure()
        run: |
          echo "--- api ---";      tail -200 /tmp/api.log      || true
          echo "--- redirect ---"; tail -200 /tmp/redirect.log || true

      - name: Stop services
        if: always()
        run: kill "$API_PID" "$REDIRECT_PID" 2>/dev/null || true

  # The `verify` job above starts the compiled JS directly and never touches the
  # container images or the worker. Two of the audit's showstoppers (CloudFront
  # rewriting Host, and CloudFront-Viewer-Country never being forwarded) passed
  # every unit test and full CI because neither exists until the real edge and
  # the real container stack are in front. This job brings up the actual
  # `docker compose --profile full` stack on every PR and runs the smoke suites
  # against the container images, so a regression in the redirect path fails CI
  # rather than being found after deploy.
  integration:
    name: Compose integration harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The runner needs pnpm/node only to run migrations against the composed
      # database (`pnpm db:migrate`). The apps themselves run inside containers.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordering matters. The composed api/redirect/worker run NODE_ENV=production,
      # do NOT auto-migrate, and depend_on postgres service_healthy with
      # restart: unless-stopped — so if started against an empty schema they
      # crash-loop until it exists. Bring up ONLY postgres first, migrate against
      # its host-published port, then start the apps against a ready schema.
      - name: Start database
        run: docker compose up -d --wait postgres

      - name: Apply migrations
        # Only DATABASE_URL is needed; the apps get their own env from
        # docker-compose.yml. No secrets are set here.
        run: DATABASE_URL=postgres://snapurl:snapurl@localhost:5433/snapurl pnpm db:migrate

      # Build the three images and start api/redirect/worker. `--wait` blocks on
      # the api and redirect healthchecks; the worker has no healthcheck, so it
      # will not block on the worker — expected and correct.
      - name: Build and start the full stack
        run: docker compose --profile full up -d --build --wait

      # The composed api/redirect publish the same host ports (3001/3002) the
      # scripts target by default, so no env override is needed here.
      - name: Smoke — dashboard API
        run: bash scripts/smoke.sh

      # Exercises, against the CONTAINER images for the first time: the real
      # 302+Location, the cloudfront-viewer-country routing match, and the
      # password-unlock round-trip. DATABASE_URL points the script's psql branch
      # at the composed postgres on 5433.
      - name: Smoke — redirect path
        run: bash scripts/smoke-redirect.sh
        env:
          DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl

      # The one behaviour the smoke scripts cannot cover: a real click surviving
      # the live worker's rollup from click_events into click_daily.
      - name: Integration assertions — click rollup
        run: bash scripts/integration-assertions.sh
        env:
          DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl

      # A silently-broken adapter can serve wrong-but-2xx responses that the
      # smoke assertions do not catch. pino logs errors at numeric level 50
      # (pino: error=50), and all three apps emit JSON logs (api is nestjs-pino,
      # redirect/worker are pino/fastify-pino). Match the structured marker
      # "level":50 rather than the bare word "error", which appears benignly in
      # URLs, slugs and info lines and would produce false positives.
      #
      # The GATE is scoped to api and redirect only. The issue's target is "a
      # silently-broken ADAPTER" — the api/redirect HTTP surfaces serving
      # wrong-but-2xx. The worker is deliberately excluded: it uses error-level
      # logging for benign operational conditions (a stuck projection, a
      # transient job retry logged as "job failed") that are not adapter
      # regressions, so gating on them would false-positive and flake the run.
      # A worker crash is still diagnosable — the "Container logs" step below
      # dumps every service on failure, and a dead worker also fails the rollup
      # assertion above.
      - name: Fail on container errors
        id: log_error_gate
        run: |
          found=0
          for svc in api redirect; do
            logs="$(docker compose --profile full logs --no-color "$svc" 2>&1)"
            if echo "$logs" | grep -F '"level":50'; then
              echo "::error::$svc logged a pino error-level line"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then exit 1; fi

      # Without this a failed run shows only which assertion failed, not the
      # container-side reason for it.
      - name: Container logs
        if: failure()
        run: |
          docker compose --profile full logs --no-color
          docker compose --profile full ps

      - name: Tear down
        if: always()
        run: docker compose --profile full down -v

  # Done-when #1 of #288: "the smoke suite passes with LINK_PROJECTION=dynamo".
  #
  # The `verify` and `integration` jobs above run the DEFAULT topology —
  # LINK_PROJECTION unset (=none) and CLICK_SINK unset (=postgres) — so the
  # redirect uses PostgresLinkResolver + PostgresClickSink there and those jobs
  # are byte-for-byte unaffected by this one. This ADDITIONAL job is the only
  # place LINK_PROJECTION=dynamo runs.
  #
  # It proves the AWS-profile resolution path end to end against a real (local)
  # DynamoDB: a dynamodb-local service container stands in for the CDK-created
  # table, the worker (LINK_PROJECTION=dynamo) drains the projection_outbox the
  # API wrote into it, and the redirect (LINK_PROJECTION=dynamo) resolves every
  # smoke assertion out of DynamoDB — no Postgres in its resolve path. The
  # adapters point at localhost:8000 via AWS_ENDPOINT_URL_DYNAMODB, the optional
  # endpoint override main.ts reads (unset in production => real AWS endpoint).
  #
  # What this job does NOT prove and why: the SQS click path stays on the
  # Postgres default here (CLICK_SINK unset). Standing up an SQS emulator would
  # only re-test what the SqsClickSink + worker-consumer unit tests already
  # cover; the freeze/thaw survival of an awaited SQS send is a unit-test
  # assertion, and the real no-VPC / real-SQS behaviours are deploy-deferred
  # (see docs/DECISIONS.md, Profile 3). So the API still writes click_events to
  # Postgres in this job, exactly as the default path does; only link
  # RESOLUTION moves to DynamoDB, which is what Done-when #1 names.
  dynamo-smoke:
    name: LINK_PROJECTION=dynamo smoke (dynamodb-local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        # Same image and shape as `verify` — the API + worker still use Postgres
        # (the API writes links + the outbox; the worker reads a link's config
        # for an upsert and writes click_events). uuidv7() needs Postgres 18.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: snapurl
          POSTGRES_PASSWORD: snapurl
          POSTGRES_DB: snapurl
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U snapurl -d snapurl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The real (local) DynamoDB the projection is written to and read from.
      # GitHub Actions runs Docker, so a service container is the simplest way
      # to get a durable-for-the-job DynamoDB on localhost:8000.
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl
      DATABASE_SSL: "false"
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real-000
      WEB_ORIGIN: http://localhost:3000
      DEFAULT_DOMAIN: localhost:3002
      REDIRECT_ORIGIN: http://localhost:3002
      MAIL_TRANSPORT: outbox
      THROTTLE_LIMIT: "100000"
      # debug (not warn) FOR THIS JOB ONLY: the projection writer's failures are
      # logged by drainOutbox at info level (projectionFailures) and a swallowed
      # per-op error is logged by the worker at debug/error — at warn they are
      # invisible, which is exactly why a projection that wrote nothing looked
      # silent. debug surfaces the resolver GetItem and writer BatchWrite errors
      # in worker.log / redirect.log so a future failure localises immediately.
      # The other jobs keep warn; this does not change any app default.
      LOG_LEVEL: debug
      SNAPURL_ALLOW_UNCONFIGURED_BUILD: "true"
      # The AWS-profile switch under test. Only this job sets it.
      LINK_PROJECTION: dynamo
      LINK_PROJECTION_TABLE: snapurl-link-projection
      # dynamodb-local needs a region + (dummy) credentials to accept requests,
      # and the endpoint override the adapters read so they target it rather
      # than the real regional endpoint. AWS_ENDPOINT_URL_DYNAMODB is the
      # service-specific override dynamoEndpoint() prefers.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm db:migrate

      # Create the projection table + linkId GSI in dynamodb-local. In
      # production the CDK stack creates this table (PAY_PER_REQUEST + PITR);
      # here we recreate only the SHAPE the adapters depend on. The key,
      # attribute and index names below are the ones the shared mapper in
      # packages/database/src/link-projection.ts uses — PK/SK (from domainPk /
      # linkSk / domainMetaKey), the linkId attribute (LINK_ID_ATTR) and the
      # linkId-index GSI (LINK_ID_GSI) the delete path queries. The AWS CLI is
      # preinstalled on the runner and honours AWS_ENDPOINT_URL_DYNAMODB + the
      # dummy creds set in the job env, so no extra tooling is needed.
      - name: Create the DynamoDB projection table
        run: |
          set -euo pipefail
          aws dynamodb create-table \
            --table-name "$LINK_PROJECTION_TABLE" \
            --billing-mode PAY_PER_REQUEST \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
              AttributeName=linkId,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --global-secondary-indexes \
              'IndexName=linkId-index,KeySchema=[{AttributeName=linkId,KeyType=HASH}],Projection={ProjectionType=ALL}'
          aws dynamodb wait table-exists --table-name "$LINK_PROJECTION_TABLE"
          echo "dynamodb-local: table $LINK_PROJECTION_TABLE ready with linkId-index GSI"

      - name: Start the API, redirect and worker
        run: |
          # The API writes links + projection_outbox rows to Postgres. It does
          # NOT read LINK_PROJECTION, so it needs no DynamoDB env — but the
          # shared job env is harmless to it.
          PORT=3001 node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

          # The redirect resolves from DynamoDB (LINK_PROJECTION=dynamo). Its
          # click sink stays on Postgres (CLICK_SINK unset), so it keeps a
          # Postgres handle for clicks + salts, but every /:slug resolve is a
          # DynamoDB GetItem. A short link-cache TTL keeps a transient miss
          # (a slug queried a beat before the worker projects it) self-healing
          # within a second rather than caching a 404 for the default 10s.
          LINK_CACHE_TTL_SECONDS=1 PORT=3002 node apps/redirect/dist/main.js > /tmp/redirect.log 2>&1 &
          echo "REDIRECT_PID=$!" >> "$GITHUB_ENV"

          # The worker drains the projection_outbox into dynamodb-local. Run it
          # as its normal loop with a fast (1s) frequent interval so links the
          # smoke script creates up front are projected before it starts firing
          # redirect assertions. The smoke script creates all 12 fixtures in its
          # setup phase, THEN asserts, so a 1s drain loop has the outbox emptied
          # into DynamoDB well before the first assertion.
          ROLLUP_INTERVAL_SECONDS=1 node apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for both HTTP services to be healthy
        run: |
          for name in "api:3001/api/v1/health" "redirect:3002/health"; do
            label="${name%%:*}"; url="http://localhost:${name#*:}"
            for i in $(seq 1 40); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$label is up"; break
              fi
              if [ "$i" = "40" ]; then
                echo "::error::$label did not become healthy within 40s"
                echo "--- api.log ---";      tail -50 /tmp/api.log      || true
                echo "--- redirect.log ---"; tail -50 /tmp/redirect.log || true
                echo "--- worker.log ---";   tail -50 /tmp/worker.log   || true
                exit 1
              fi
              sleep 1
            done
          done

      # The proof: every redirect assertion resolved out of DynamoDB. The script
      # creates its fixtures via the API (which writes the outbox), the worker
      # loop drains them into dynamodb-local, and the redirect 302s/404s are all
      # served from the projection. Its direct-DB privacy/click checks still read
      # Postgres (click_events is still written there under the default sink).
      - name: Smoke — redirect path (resolving from DynamoDB)
        run: bash scripts/smoke-redirect.sh
        env:
          DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl

      - name: Service logs
        if: failure()
        run: |
          echo "--- api ---";      tail -200 /tmp/api.log      || true
          echo "--- redirect ---"; tail -200 /tmp/redirect.log || true
          echo "--- worker ---";   tail -200 /tmp/worker.log   || true

      # The single most decisive diagnostic when the smoke step fails: dump what
      # the worker actually projected into dynamodb-local. This localises the
      # fault to ONE side with no guessing:
      #   * empty / missing LINK items  -> the WRITER never projected (e.g. a
      #     BatchWrite that threw — a marshalling error on an undefined attribute,
      #     an endpoint the writer did not honour). Cross-check with worker.log.
      #   * populated with the expected PK=d#localhost:3002 / SK=s#<run>-<name>
      #     items -> the writer is fine and the READER is the bug (endpoint,
      #     key derivation, or unmarshalling). Cross-check with redirect.log.
      # AWS_ENDPOINT_URL_DYNAMODB + the dummy creds are already in the job env,
      # so the preinstalled AWS CLI targets dynamodb-local directly. The creds
      # are the literal string "dummy" (not a secret), so nothing sensitive is
      # printed. --max-items caps the dump so a large table cannot flood the log.
      - name: DynamoDB projection contents (diagnostic)
        if: failure()
        run: |
          echo "--- item count (projected LINK + domain-meta items) ---"
          aws dynamodb scan --table-name "$LINK_PROJECTION_TABLE" \
            --select COUNT --output json || true
          echo "--- first 20 projected items (PK/SK/linkId + destination) ---"
          aws dynamodb scan --table-name "$LINK_PROJECTION_TABLE" \
            --max-items 20 \
            --projection-expression "PK, SK, linkId, destination" \
            --output json || true

      - name: Stop services
        if: always()
        run: kill "$API_PID" "$REDIRECT_PID" "$WORKER_PID" 2>/dev/null || true

  # The one thing self-hosted Postgres on a single volume gets wrong is the
  # restore. A backup script that is never restored is a backup that does not
  # exist. This job exercises the real deploy/single-node/backup.sh and
  # restore.sh end to end against a fresh database: migrate, plant known data,
  # back up, destroy everything, restore, and FAIL unless the exact data comes
  # back. That is what makes the single-node restore path supported rather than
  # documented-and-hoped-for.
  restore-test:
    name: Backup and restore round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        # Same image and shape as the `verify` job — the schema uses uuidv7(),
        # native in Postgres 18 and absent in 17.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: snapurl
          POSTGRES_PASSWORD: snapurl
          POSTGRES_DB: snapurl
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U snapurl -d snapurl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Direct connection string both the scripts and the psql probes use. No
      # secret: these are the throwaway CI credentials from the service block.
      DATABASE_URL: postgres://snapurl:snapurl@localhost:5433/snapurl
      DATABASE_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prove backup+restore preserves the real schema, not just the probe:
      # apply every migration first so drizzle's bookkeeping and the app tables
      # exist before we plant data.
      - name: Migrate
        run: pnpm db:migrate

      # backup.sh/restore.sh call pg_dump/psql when DATABASE_URL is set, and so
      # do the probe steps below. The runner ships pg_dump/psql 16, but the
      # service is Postgres 18 (uuidv7()), and pg_dump refuses to dump a server
      # newer than the client. Use the client from the postgres:18-alpine image
      # instead so the client major matches the server. --network host lets the
      # container reach the service on localhost:5433, exactly as the scripts'
      # DATABASE_URL expects. The image is already pulled for the service
      # container, so this adds no extra download.
      #
      # PG_CLIENT is exported to GITHUB_ENV so every later step (backup,
      # restore, and the psql probes) uses the version-matched client. The
      # scripts honour PG_DUMP/PSQL overrides; the probes call PG_CLIENT
      # directly.
      - name: Use a Postgres 18 client for the round-trip
        run: |
          set -euo pipefail
          # Route the DATABASE_URL host (localhost) to the runner's network via
          # --network host, and mount /tmp so the backup file the scripts write
          # is visible to both the container and later steps.
          # -i (attach stdin) is required so a host-side pipe reaches the
          # containerized client — restore.sh does `gzip -dc file | $PSQL ...`,
          # and without -i the container has no stdin, so gzip dies with
          # "stdout: Broken pipe". Harmless for the `-c` and pg_dump steps.
          pg_client="docker run --rm -i --network host -v /tmp:/tmp postgres:18-alpine"
          echo "PG_CLIENT=$pg_client" >> "$GITHUB_ENV"
          echo "PG_DUMP=$pg_client pg_dump" >> "$GITHUB_ENV"
          echo "PSQL=$pg_client psql" >> "$GITHUB_ENV"

      # Plant a deterministic marker in a dedicated probe table, and capture the
      # count of applied migrations from drizzle's bookkeeping table. Both must
      # come back after the restore for the job to pass, which proves data AND
      # migrated schema round-trip.
      - name: Plant known data
        run: |
          set -euo pipefail
          $PG_CLIENT psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE restore_probe(id int primary key, marker text);"
          $PG_CLIENT psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO restore_probe VALUES (1, 'sentinel-restore-286-ok');"
          migrations="$($PG_CLIENT psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            'SELECT count(*) FROM drizzle.__drizzle_migrations;')"
          echo "captured migration count: $migrations"
          if [ "$migrations" -lt 1 ]; then
            echo "::error::expected at least one applied migration before backup"
            exit 1
          fi
          echo "EXPECTED_MIGRATIONS=$migrations" >> "$GITHUB_ENV"

      # Direct-mode backup (DATABASE_URL path). BACKUP_DIR is absolute so it is
      # independent of restore.sh's `cd $(dirname $0)`.
      - name: Back up
        run: BACKUP_DIR=/tmp/snapurl-backups bash deploy/single-node/backup.sh

      - name: Resolve backup file
        run: |
          set -euo pipefail
          backup_file="$(ls -1t /tmp/snapurl-backups/*.sql.gz | head -n1)"
          if [ -z "$backup_file" ]; then
            echo "::error::no backup file produced"
            exit 1
          fi
          echo "backup file: $backup_file"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"

      # Simulate the disaster: drop the app schema AND the drizzle bookkeeping
      # schema, then confirm the drop actually destroyed the data. A restore
      # that passes against a database that was never emptied proves nothing.
      - name: Destroy the data
        run: |
          set -euo pipefail
          $PG_CLIENT psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "DROP SCHEMA public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS drizzle CASCADE;"
          # The probe table must be gone now.
          gone="$($PG_CLIENT psql "$DATABASE_URL" -At -c \
            "SELECT to_regclass('public.restore_probe') IS NULL;")"
          if [ "$gone" != "t" ]; then
            echo "::error::probe table still present after drop — the drop did not take effect"
            exit 1
          fi
          echo "confirmed: probe data destroyed"

      - name: Restore
        run: bash deploy/single-node/restore.sh "$BACKUP_FILE"

      # The proof. The exact sentinel must return, and the migration bookkeeping
      # count must match what was captured before the drop.
      - name: Assert recovery
        run: |
          set -euo pipefail
          marker="$($PG_CLIENT psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            'SELECT marker FROM restore_probe WHERE id = 1;')"
          if [ "$marker" != "sentinel-restore-286-ok" ]; then
            echo "::error::restored marker mismatch: got '$marker'"
            exit 1
          fi
          echo "probe marker recovered: $marker"
          restored_migrations="$($PG_CLIENT psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            'SELECT count(*) FROM drizzle.__drizzle_migrations;')"
          if [ "$restored_migrations" != "$EXPECTED_MIGRATIONS" ]; then
            echo "::error::migration count mismatch after restore: got '$restored_migrations', expected '$EXPECTED_MIGRATIONS'"
            exit 1
          fi
          echo "migration bookkeeping recovered: $restored_migrations rows"
          echo "backup/restore round-trip verified"
