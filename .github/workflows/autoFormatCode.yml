name: Auto Format Code with Prettier
# Formats the v1 backend/ and frontend/ directories when a push is made to main.
#
# Scope note: this does NOT cover web/, apps/ or packages/ — v2 has no Prettier
# configuration yet, and adding one would produce a diff touching every file.
# Tracked separately. Pull requests are verified by verify.yml.

on:
  push:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install --prefix backend && npm install --prefix frontend

      - name: Run Prettier in /backend
        run: npm run format --prefix backend

      - name: Run Prettier in /frontend
        run: npm run format --prefix frontend

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code --quiet || echo "::set-output name=changes::true"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit files
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add .
          git commit -m "Auto formatting with Prettier"
          git push
