packages:
  - "web"
  - "e2e"
  - "apps/*"
  - "packages/*"
  # CDK stack. Not a runtime dependency of anything in apps/ or packages/.
  - "infra"

# These three ship native binaries and need their install scripts to run:
# esbuild and sharp come from the Next.js toolchain, argon2 is the password hash.
allowBuilds:
  esbuild: true
  sharp: true
  argon2: true
  '@scarf/scarf': true

minimumReleaseAgeExclude:
  - '@next/env@15.5.26'
  - '@next/swc-darwin-arm64@15.5.26'
  - '@next/swc-darwin-x64@15.5.26'
  - '@next/swc-linux-arm64-gnu@15.5.26'
  - '@next/swc-linux-arm64-musl@15.5.26'
  - '@next/swc-linux-x64-gnu@15.5.26'
  - '@next/swc-linux-x64-musl@15.5.26'
  - '@next/swc-win32-arm64-msvc@15.5.26'
  - '@next/swc-win32-x64-msvc@15.5.26'
  - next@15.5.26

# fastify@5.11.3 (still resolved transitively via @nestjs/platform-fastify) is
# affected by GHSA-3m5p-2c4r-xxw2 and GHSA-w2qp-rph6-63g4; both are patched in
# 5.12.1. Direct deps in apps/api and apps/redirect are bumped in their own
# package.json, but @nestjs/platform-fastify@11.2.3 pins fastify itself, so an
# override is needed to close the transitive copy too. See issue #537.
#
# sharp@0.34.5 (an optional dependency of next) inherits libvips/libheif
# vulnerabilities (GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c), fixed in 0.35.4+.
# next@15.5.26 widens its optional range to `^0.34.3 || ^0.35.4`, which still
# allows the vulnerable 0.34.5 to resolve, so an override is needed to force
# the fixed line. See issue #591.
#
# postcss@8.4.31 is a direct dependency of next@15.5.26, pinned to that exact
# version (not a range), for its internal CSS build pipeline. It carries four
# advisories fixed across 8.5.10-8.5.23 (GHSA-6g55-p6wh-862q / CVE-2026-45623,
# GHSA-fxqj-rqcc-2cmp / CVE-2026-69153, GHSA-qx2v-qp2m-jg93 / CVE-2026-41305,
# GHSA-r28c-9q8g-f849 / CVE-2026-73646), the worst an arbitrary-file-read via
# the sourceMappingURL comment parser. Everything else in the workspace
# already resolves postcss to 8.5.26+ on its own; only next's pinned copy
# needs forcing. See issue #590.
#
# fast-uri and brace-expansion are transitive copies pulled in through
# fastify's own dependency tree (ajv / @fastify/ajv-compiler / fast-json-stringify
# for fast-uri; glob / minimatch for brace-expansion) — runtime-reachable in
# both apps/api and apps/redirect, since both depend on fastify directly.
# fast-uri@3.1.6 and @4.1.3 carry GHSA-58mr-gqgx-xq4g / CVE-2026-84394,
# GHSA-hrr3-gc8f-f4qj / CVE-2026-86472, GHSA-qw65-cvwx-89v3 / CVE-2026-84292,
# and (4.1.3 only) GHSA-jvvf-x445-j334 / CVE-2026-86818, all fixed at 4.1.5+.
# brace-expansion@1.1.18/2.1.4/5.0.9 carry GHSA-6j4f-fj2g-mc7p / CVE-2026-102276,
# GHSA-q2hr-2g5m-vwhr / CVE-2026-102277 and GHSA-qhr7-859c-m2p7 / CVE-2026-102278,
# fixed per-major at 1.1.19+/2.1.5+/5.0.12+ — forced to the 5.x line since that
# is what fastify's own glob dependency already resolves to. See issue #632.
#
# js-yaml is transitive and devDependency-only here: cosmiconfig (via
# fork-ts-checker-webpack-plugin, via @nestjs/cli) resolves 4.3.1, and
# @nestjs/swagger pins 5.3.0 exactly. Both carry parser advisories
# (GHSA-2883-xcg3-v3hh / CVE-2026-84375 on 4.3.1, fixed 4.3.2; an unaliased
# advisory on 5.3.0, fixed 5.4.1). Neither js-yaml copy ships in a runtime
# bundle — @nestjs/cli and @nestjs/swagger's own js-yaml use is build/tooling
# only. Forced to the next patch in each major line. See issue #632.
#
# esbuild is transitive and devDependency-only: @esbuild-kit/core-utils (via
# drizzle-kit, now-unmaintained and superseded by tsx upstream) pins an exact
# 0.18.20, and apps/extension's own build pins 0.24.2. Both are affected by
# GHSA-67mh-4wv8-2f99 (esbuild's dev server will respond to any origin),
# fixed at 0.25.0+. Not runtime-reachable — esbuild is a build-time tool in
# every one of its consumers here, never shipped. Forced to the version
# drizzle-kit's own direct esbuild dependency already resolves to elsewhere
# in this lockfile. See issue #632.
overrides:
  fastify@<5.12.1: ^5.12.1
  sharp@<0.35.4: ^0.35.4
  postcss@<8.5.23: ^8.5.23
  fast-uri@<4.1.5: ^4.1.5
  brace-expansion@<5.0.12: ^5.0.12
  js-yaml@<4.3.2: ^4.3.2
  js-yaml@5.3.0: ^5.4.1
  esbuild@<0.25.0: ^0.25.12
