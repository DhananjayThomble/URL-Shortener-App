# Local dependencies for SnapURL 2.0.
# Postgres is on 5433, not 5432 — 5432 is already taken on this machine.
services:
  postgres:
    image: postgres:18-alpine
    container_name: snapurl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapurl
      POSTGRES_PASSWORD: snapurl
      POSTGRES_DB: snapurl
    ports:
      - "5433:5432"
    volumes:
      - snapurl-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapurl -d snapurl"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  snapurl-pgdata:
